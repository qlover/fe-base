name: General check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-code:
    if: |
      !contains(github.event.pull_request.labels.*.name, 'CI-Release')
    runs-on: ubuntu-latest
    env:
      # NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      # Disable daemon process to prevent hangs in CI
      NX_DAEMON: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set SHAs for Nx affected
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: master

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Cache NX cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-cache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            nx-cache-${{ github.ref_name }}-
            nx-cache-master-
      
      # 使用 build:packages:force，而不是 build:packages（nx affected）。
      # examples 通过 package.json 解析 @qlover/* 类型到 dist/*.d.ts，且 dist 被 gitignore。
      # 当 PR 只改 examples 时，nx affected:build --exclude=examples 往往不会构建任何 package，
      # type-check 会因缺少 dist 报 TS2307。强制构建全部 packages，保证 example type-check 前
      # dist 一定存在（与 release.yml 一致）。
      - name: Build packages (exclude examples)
        timeout-minutes: 10
        run: pnpm build:packages:force

      - name: Type check
        timeout-minutes: 10
        run: pnpm type-check

      - name: Lint
        timeout-minutes: 5
        run: pnpm lint

      - run: pnpm test
      - run: pnpm rebuild
